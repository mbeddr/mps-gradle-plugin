name: Release

on:
  push:
    tags:
      - 'mps-gradle-plugin-*'
      - 'git-based-versioning-*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Select project
        id: project
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            mps-gradle-plugin-*) echo 'directory=.' >> "$GITHUB_OUTPUT" ;;
            git-based-versioning-*) echo 'directory=git-based-versioning' >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: jetbrains
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-disabled: true
      - name: Check release version
        env:
          PROJECT_DIR: ${{ steps.project.outputs.directory }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./gradlew -p "$PROJECT_DIR" checkReleaseVersion -PreleaseTag="$RELEASE_TAG"
      - name: Build
        env:
          PROJECT_DIR: ${{ steps.project.outputs.directory }}
        run: ./gradlew -p "$PROJECT_DIR" build
      - name: Publish
        env:
          PROJECT_DIR: ${{ steps.project.outputs.directory }}
          ARTIFACTS_ITEMIS_CLOUD_USER: ${{ secrets.ARTIFACTS_ITEMIS_CLOUD_USER }}
          ARTIFACTS_ITEMIS_CLOUD_PW: ${{ secrets.ARTIFACTS_ITEMIS_CLOUD_PW }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew -p "$PROJECT_DIR" publish
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
