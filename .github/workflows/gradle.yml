# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches:
      - 'v1.x'
      - 'master'
  pull_request:
    branches:
      - 'v1.x'
      - 'master'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: jetbrains
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload JUnit XMLs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: junit-xmls
          path: '**/build/test-results/**/TEST-*.xml'
          retention-days: 7
      - uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3 # v5.6.2
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          require_tests: true
          summary: true
          annotate_only: true

  snapshots:
    name: Publish snapshot (${{ matrix.project }})
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      matrix:
        project: ['.', 'git-based-versioning']
    env:
      PROJECT_DIR: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check for snapshot version
        id: version
        run: |
          version=$(sed -n 's/^version=//p' "$PROJECT_DIR/gradle.properties")
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo 'snapshot=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Java 17
        if: steps.version.outputs.snapshot == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: jetbrains
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        if: steps.version.outputs.snapshot == 'true'
      - name: Build and publish snapshot to itemis
        if: steps.version.outputs.snapshot == 'true'
        env:
          ARTIFACTS_ITEMIS_CLOUD_USER: ${{ secrets.ARTIFACTS_ITEMIS_CLOUD_USER }}
          ARTIFACTS_ITEMIS_CLOUD_PW: ${{ secrets.ARTIFACTS_ITEMIS_CLOUD_PW }}
        run: ./gradlew -p "$PROJECT_DIR" build publishAllPublicationsToItemisCloudRepository
